  <circle cx="400" cy="195" r="62" fill="url(#lanternGlow)"/>
  <ellipse cx="400" cy="195" rx="34" ry="40" fill="#ef4444" stroke="#fde047" stroke-width="3"/>
  <circle cx="580" cy="215" r="52" fill="url(#lanternGlow)"/>
  <ellipse cx="580" cy="215" rx="28" ry="34" fill="#ef4444" stroke="#fde047" stroke-width="3"/>
  <!-- Street Food Stalls -->
  <rect x="170" y="320" width="140" height="130" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <rect x="330" y="310" width="140" height="140" rx="12" fill="#1f2937" stroke="#fb923c" stroke-width="2"/>
  <rect x="490" y="320" width="140" height="130" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
