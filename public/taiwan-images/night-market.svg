<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#ff5a36"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#night)"/>
  <!-- Market Archway -->
  <rect x="110" y="130" width="24" height="320" fill="#dc2626"/>
  <rect x="666" y="130" width="24" height="320" fill="#dc2626"/>
  <path d="M70 140 Q400 75 730 140 L710 175 Q400 118 90 175 Z" fill="#f59e0b"/>
