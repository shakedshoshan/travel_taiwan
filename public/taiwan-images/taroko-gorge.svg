<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gorgeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="cliffL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#gorgeSky)"/>
  <!-- High mountain peaks -->
  <polygon points="80,450 280,65 490,450" fill="#047857" opacity="0.65"/>
  <polygon points="340,450 560,50 760,450" fill="#065f46" opacity="0.7"/>
  <!-- Marble Gorge Cliffs -->
  <polygon points="0,0 290,0 350,450 0,450" fill="url(#cliffL)"/>
  <polygon points="800,0 520,0 450,450 800,450" fill="url(#cliffL)"/>
  <!-- Turquoise Liwu River -->
  <polygon points="350,450 385,260 420,260 450,450" fill="#06b6d4"/>
  <!-- Red Suspension Bridge -->
  <path d="M295 220 Q400 255 505 220" fill="none" stroke="#ef4444" stroke-width="8"/>
  <path d="M295 200 Q400 245 505 200" fill="none" stroke="#fca5a5" stroke-width="3"/>
</svg>
